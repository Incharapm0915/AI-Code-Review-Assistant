<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AI Code Review Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    .auth-bg-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 50px 50px; pointer-events: none;
    }
    .form-error { color: var(--danger); font-size: 0.8rem; margin-top: 6px; display: none; }
    .password-toggle {
      position: absolute; right: 14px; cursor: pointer;
      color: var(--text-muted); font-size: 1.1rem; top: 50%; transform: translateY(-50%);
    }
  </style>
</head>
<body>
<div class="auth-bg-orb orb-1" style="position:fixed;"></div>
<div class="auth-bg-orb orb-2" style="position:fixed;"></div>
<div class="auth-bg-grid"></div>

<div class="auth-container">
  <div class="auth-card">
    <a href="/" style="position:absolute;top:20px;left:20px;color:var(--text-muted);font-size:0.85rem;">← Back</a>

    <div class="auth-logo">🤖</div>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your AI Code Review account</p>

    <div id="error-banner" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md);padding:12px 16px;color:#f87171;font-size:0.875rem;margin-bottom:16px;"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label">Email or Username</label>
        <div class="input-group">
          <span class="input-icon">
            <svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" class="form-control" id="identifier" placeholder="email@example.com or username" required autocomplete="username">
        </div>
        <div class="form-error" id="identifier-error">This field is required</div>
      </div>

      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;">
          Password
          <a href="/forgot-password" style="font-size:0.8rem;font-weight:400;">Forgot password?</a>
        </label>
        <div class="input-group" style="position:relative;">
          <span class="input-icon">
            <svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <span class="password-toggle" onclick="togglePassword('password')">👁</span>
        </div>
        <div class="form-error" id="password-error">Password is required</div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
        <input type="checkbox" id="remember" style="accent-color:var(--primary);">
        <label for="remember" style="font-size:0.875rem;color:var(--text-secondary);cursor:pointer;">Remember me for 30 days</label>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">
        Sign In →
      </button>

      <div class="separator">or</div>

      <a href="/api/auth/github-oauth" class="btn btn-secondary w-full" style="justify-content:center;">
        <svg width="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
      </a>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:0.875rem;color:var(--text-muted);">
      Don't have an account? <a href="/register" style="color:var(--primary-light);font-weight:600;">Create one free →</a>
    </p>

    <!-- Demo credentials -->
    <div style="margin-top:20px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:var(--radius-md);padding:12px 16px;">
      <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:4px;">🔑 Demo Credentials:</p>
      <p style="font-size:0.8rem;color:var(--primary-light);">admin@aicodereviewer.com / Admin@123456</p>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/main.js"></script>
<script>
  // Redirect if already logged in
  if (App.isAuthenticated()) window.location.href = '/dashboard';

  function togglePassword(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const banner = document.getElementById('error-banner');

    banner.style.display = 'none';

    if (!identifier || !password) {
      banner.textContent = 'Please fill in all fields.';
      banner.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Signing in...';

    try {
      const res = await API.post('/api/auth/login', {
        email: identifier.includes('@') ? identifier : undefined,
        username: !identifier.includes('@') ? identifier : undefined,
        password
      });

      if (res?.data) {
        App.setAuth(res.data.user, res.data.access_token);
        localStorage.setItem('refresh_token', res.data.refresh_token);
        Toast.success('Welcome back!', `Hello, ${res.data.user.full_name || res.data.user.username}`);
        setTimeout(() => { window.location.href = '/dashboard'; }, 500);
      }
    } catch (err) {
      banner.textContent = err.message || 'Invalid credentials. Please try again.';
      banner.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'Sign In →';
    }
  });
</script>
</body>
</html>

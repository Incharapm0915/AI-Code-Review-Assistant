<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — AI Code Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-bg-orb orb-1" style="position:fixed;"></div>
<div class="auth-bg-orb orb-2" style="position:fixed;"></div>

<div class="auth-container">
  <div class="auth-card">
    <a href="/login" style="position:absolute;top:20px;left:20px;color:var(--text-muted);font-size:0.85rem;">← Back to Login</a>
    <div class="auth-logo">🔐</div>
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-subtitle">Enter your email and we'll send a reset link</p>

    <div id="success-msg" style="display:none;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:var(--radius-md);padding:16px;color:#34d399;text-align:center;margin-bottom:16px;">
      ✅ If that email exists, a reset link has been sent. Check your inbox.
    </div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-icon">📧</span>
          <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn">Send Reset Link</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--text-muted);">
      Remember your password? <a href="/login" style="color:var(--primary-light);">Sign in</a>
    </p>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/main.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Sending...';
    try {
      await API.post('/api/auth/forgot-password', { email });
      document.getElementById('success-msg').style.display = 'block';
      document.getElementById('forgot-form').style.display = 'none';
    } catch (err) {
      Toast.error('Error', err.message);
      btn.disabled = false;
      btn.innerHTML = 'Send Reset Link';
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — AI Code Review Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    .auth-bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; }
    .strength-bar { height: 4px; border-radius: 2px; background: var(--bg-tertiary); margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .password-toggle { position: absolute; right: 14px; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
<div class="auth-bg-orb orb-1" style="position:fixed;"></div>
<div class="auth-bg-orb orb-2" style="position:fixed;"></div>
<div class="auth-bg-grid"></div>

<div class="auth-container">
  <div class="auth-card" style="width:min(100%,480px);">
    <a href="/" style="position:absolute;top:20px;left:20px;color:var(--text-muted);font-size:0.85rem;">← Back</a>

    <div class="auth-logo">🚀</div>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Start reviewing code with AI — it's free</p>

    <div id="error-banner" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md);padding:12px 16px;color:#f87171;font-size:0.875rem;margin-bottom:16px;"></div>

    <form id="register-form" novalidate>
      <div class="grid-2">
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="full_name" placeholder="John Doe" autocomplete="name">
        </div>
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">Username <span style="color:var(--danger);">*</span></label>
          <input type="text" class="form-control" id="username" placeholder="johndoe" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address <span style="color:var(--danger);">*</span></label>
        <div class="input-group">
          <span class="input-icon">
            <svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" class="form-control" id="email" placeholder="john@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password <span style="color:var(--danger);">*</span></label>
        <div class="input-group" style="position:relative;">
          <span class="input-icon">
            <svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" class="form-control" id="password" placeholder="Min 8 chars, uppercase, number" required autocomplete="new-password" oninput="checkStrength(this.value)">
          <span class="password-toggle" onclick="togglePwd('password')">👁</span>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%;"></div></div>
        <div id="strength-label" style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password <span style="color:var(--danger);">*</span></label>
        <div class="input-group" style="position:relative;">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-control" id="confirm_password" placeholder="Repeat password" required autocomplete="new-password">
          <span class="password-toggle" onclick="togglePwd('confirm_password')">👁</span>
        </div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;">
        <input type="checkbox" id="terms" style="accent-color:var(--primary);margin-top:3px;" required>
        <label for="terms" style="font-size:0.8rem;color:var(--text-secondary);cursor:pointer;line-height:1.5;">
          I agree to the <a href="#" style="color:var(--primary-light);">Terms of Service</a> and <a href="#" style="color:var(--primary-light);">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg" id="register-btn">
        Create Free Account →
      </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:0.875rem;color:var(--text-muted);">
      Already have an account? <a href="/login" style="color:var(--primary-light);font-weight:600;">Sign in →</a>
    </p>

    <div style="display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
      {% for feature in ['✓ Free forever', '✓ No credit card', '✓ Real AI analysis'] %}
      <span style="font-size:0.8rem;color:var(--success);">{{ feature }}</span>
      {% endfor %}
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/main.js"></script>
<script>
  if (App.isAuthenticated()) window.location.href = '/dashboard';

  function togglePwd(id) {
    const i = document.getElementById(id);
    i.type = i.type === 'password' ? 'text' : 'password';
  }

  function checkStrength(pwd) {
    const fill = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    let score = 0;
    if (pwd.length >= 8) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[a-z]/.test(pwd)) score++;
    if (/\d/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;

    const levels = [
      { pct: '0%', color: '', text: '' },
      { pct: '20%', color: '#ef4444', text: 'Very Weak' },
      { pct: '40%', color: '#f59e0b', text: 'Weak' },
      { pct: '60%', color: '#f59e0b', text: 'Fair' },
      { pct: '80%', color: '#3b82f6', text: 'Strong' },
      { pct: '100%', color: '#10b981', text: 'Very Strong ✓' },
    ];
    const level = levels[score];
    fill.style.width = level.pct;
    fill.style.background = level.color;
    label.textContent = level.text;
    label.style.color = level.color;
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const banner = document.getElementById('error-banner');
    const btn = document.getElementById('register-btn');
    banner.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    const full_name = document.getElementById('full_name').value.trim();

    if (!username || !email || !password) {
      banner.textContent = 'Please fill in all required fields.';
      banner.style.display = 'block'; return;
    }
    if (password !== confirm) {
      banner.textContent = 'Passwords do not match.';
      banner.style.display = 'block'; return;
    }
    if (!document.getElementById('terms').checked) {
      banner.textContent = 'Please accept the terms of service.';
      banner.style.display = 'block'; return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Creating account...';

    try {
      const res = await API.post('/api/auth/register', { username, email, password, full_name });
      if (res?.data) {
        App.setAuth(res.data.user, res.data.access_token);
        Toast.success('Account created!', 'Welcome to AI Code Review');
        setTimeout(() => { window.location.href = '/dashboard'; }, 500);
      }
    } catch (err) {
      banner.textContent = err.message || 'Registration failed. Please try again.';
      banner.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'Create Free Account →';
    }
  });
</script>
</body>
</html>

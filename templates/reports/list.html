{% extends "base.html" %}
{% block title %}Reports — AI Code Review{% endblock %}
{% block page_title %}Analysis Reports{% endblock %}

{% block content %}
<div id="auth-guard" style="display:none;">

<!-- Filter Bar -->
<div class="glass-card-static" style="padding:14px 20px;margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
  <input type="text" class="form-control" id="search" placeholder="Search reports..." style="width:220px;" oninput="filterReports()">
  <select class="form-control" id="filter-lang" style="width:auto;" onchange="filterReports()">
    <option value="">All Languages</option>
    <option value="python">Python</option>
    <option value="javascript">JavaScript</option>
    <option value="java">Java</option>
    <option value="cpp">C++</option>
  </select>
  <select class="form-control" id="filter-type" style="width:auto;" onchange="filterReports()">
    <option value="">All Sources</option>
    <option value="upload">File Upload</option>
    <option value="paste">Pasted Code</option>
    <option value="github">GitHub</option>
  </select>
  <div style="margin-left:auto;display:flex;gap:8px;">
    <a href="/upload" class="btn btn-secondary btn-sm">📁 Upload</a>
    <a href="/editor" class="btn btn-primary btn-sm">+ New Review</a>
  </div>
</div>

<!-- Reports Grid -->
<div id="reports-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;">
  <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);">
    <div class="spinner" style="margin:0 auto 16px;"></div>
    Loading reports...
  </div>
</div>

<!-- Pagination -->
<div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:24px;"></div>

</div>
{% endblock %}

{% block extra_js %}
<script>
  let allReports = [];
  let currentPage = 1;

  document.addEventListener('DOMContentLoaded', async () => {
    if (!App.requireAuth()) return;
    document.getElementById('auth-guard').style.display = 'block';
    await loadReports();
  });

  async function loadReports(page = 1) {
    currentPage = page;
    try {
      const res = await API.get(`/api/reports?page=${page}&per_page=20`);
      allReports = res?.data?.reports || [];
      renderReports(allReports);
      renderPagination(res?.data?.pages || 1, page);
    } catch(err) {
      document.getElementById('reports-grid').innerHTML =
        `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--danger);">Error loading reports: ${err.message}</div>`;
    }
  }

  function renderReports(reports) {
    const grid = document.getElementById('reports-grid');
    if (!reports.length) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px;">
          <div style="font-size:3rem;margin-bottom:16px;">📭</div>
          <h3>No reports yet</h3>
          <p style="color:var(--text-muted);">Start by uploading a file or analyzing code in the editor.</p>
          <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;">
            <a href="/upload" class="btn btn-secondary">Upload File</a>
            <a href="/editor" class="btn btn-primary">Analyze Code</a>
          </div>
        </div>
      `;
      return;
    }

    const sourceIcons = { upload: '📁', paste: '📝', github: '🐙' };
    const langIcons = { python: '🐍', javascript: '⚡', java: '☕', cpp: '⚙️' };

    grid.innerHTML = reports.map(r => {
      const score = r.quality_score || 0;
      const color = getScoreColor(score);
      return `
        <div class="glass-card" style="padding:20px;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:1.3rem;">${langIcons[r.language] || '📄'}</span>
              <div>
                <div style="font-weight:700;font-size:0.9rem;">${r.language?.charAt(0).toUpperCase() + r.language?.slice(1)} Code</div>
                <div style="font-size:0.75rem;color:var(--text-muted);">${sourceIcons[r.source_type] || '📄'} ${r.source_type} • ${formatDateTime(r.created_at)}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:1.75rem;font-weight:900;color:${color};">${Math.round(score)}</div>
              <div style="font-size:0.7rem;color:var(--text-muted);">/ 100</div>
            </div>
          </div>

          <div class="progress" style="margin-bottom:16px;">
            <div class="progress-bar" style="width:${score}%;background:${color};"></div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;text-align:center;">
            <div style="background:var(--bg-tertiary);border-radius:8px;padding:8px;">
              <div style="font-weight:700;color:var(--danger);">${r.total_issues || 0}</div>
              <div style="font-size:0.7rem;color:var(--text-muted);">Issues</div>
            </div>
            <div style="background:var(--bg-tertiary);border-radius:8px;padding:8px;">
              <div style="font-weight:700;color:var(--warning);">${r.critical_issues || 0}</div>
              <div style="font-size:0.7rem;color:var(--text-muted);">Critical</div>
            </div>
            <div style="background:var(--bg-tertiary);border-radius:8px;padding:8px;">
              <div style="font-weight:700;color:var(--primary-light);">${r.vulnerabilities || 0}</div>
              <div style="font-size:0.7rem;color:var(--text-muted);">Vulns</div>
            </div>
          </div>

          <div style="display:flex;gap:8px;">
            <a href="/results/${r.id}" class="btn btn-primary btn-sm" style="flex:1;justify-content:center;">View Details →</a>
            <button onclick="downloadPDF(${r.id})" class="btn btn-secondary btn-sm" title="Download PDF">📥</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterReports() {
    const q = document.getElementById('search').value.toLowerCase();
    const lang = document.getElementById('filter-lang').value;
    const type = document.getElementById('filter-type').value;

    const filtered = allReports.filter(r => {
      const matchLang = !lang || r.language === lang;
      const matchType = !type || r.source_type === type;
      const matchQ = !q || r.language?.includes(q) || r.source_type?.includes(q);
      return matchLang && matchType && matchQ;
    });
    renderReports(filtered);
  }

  function renderPagination(totalPages, current) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="btn ${i === current ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="loadReports(${i})">${i}</button>`;
    }
    el.innerHTML = html;
  }

  async function downloadPDF(id) {
    try {
      const res = await fetch(`/api/reports/${id}/download?format=pdf`, {
        headers: { Authorization: `Bearer ${App.token}` }
      });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `report_${id}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
      Toast.success('Downloaded!');
    } catch(err) { Toast.error('Download failed', err.message); }
  }
</script>
{% endblock %}
